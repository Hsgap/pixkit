  <script>
    function launchStudioWithSavedWork(event) {
      if (event) event.preventDefault();
      localStorage.setItem('pixkit_entered', 'true');
      const lastRoute = localStorage.getItem('pixkit_last_route') || '#/home';
      const cleanRoute = lastRoute.startsWith('#') ? lastRoute : '#' + lastRoute;
      window.location.href = 'studio.html' + cleanRoute;
    }
    /**
     * Real-World Time-Based Theme Manager
     */
    const TimeThemeManager = (function() {
      const timeStatusText = document.getElementById('timeStatusText');
      let isDarkMode = false;

      function updateThemeByRealTime() {
        const now = new Date();
        const hours = now.getHours();
        const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        isDarkMode = (hours >= 19 || hours < 6);
        document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');

        if (timeStatusText) {
          if (isDarkMode) {
            timeStatusText.innerHTML = `<i class="fa-solid fa-moon"></i> Night Mode (${formattedTime})`;
          } else {
            timeStatusText.innerHTML = `<i class="fa-solid fa-sun"></i> Day Mode (${formattedTime})`;
          }
        }
      }

      updateThemeByRealTime();
      setInterval(updateThemeByRealTime, 30000);

      return {
        isDark: () => isDarkMode
      };
    })();

    /**
     * Interactive Magnetic Cursor Movement on Logo Mark
     */
    (function initMagneticLogo() {
      const logoWrap = document.getElementById('logoInteractiveWrap');
      const markBox = document.getElementById('brandMarkBox');
      const brandName = document.getElementById('brandNameText');
      if (!logoWrap || !markBox) return;

      logoWrap.addEventListener('mousemove', (e) => {
        const rect = logoWrap.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        const moveX = x * 0.22;
        const moveY = y * 0.22;
        const rotate = (x / rect.width) * 20;

        markBox.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) rotate(${rotate}deg)`;
        if (brandName) {
          brandName.style.transform = `translate3d(${moveX * 0.4}px, ${moveY * 0.4}px, 0)`;
        }
      });

      logoWrap.addEventListener('mouseleave', () => {
        markBox.style.transform = 'translate3d(0, 0, 0) rotate(0deg)';
        if (brandName) {
          brandName.style.transform = 'translate3d(0, 0, 0)';
        }
      });
    })();

    /**
     * Aceternity UI — Encrypted Text Component
     */
    (function initEncryptedText() {
      const el = document.getElementById('encryptedText');
      const container = document.getElementById('encryptedContainer');
      if (!el) return;

      const targetText = el.getAttribute('data-text') || el.innerText.trim();
      const CHARS = '!@#$%^&*()_+-=~[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      let isAnimating = false;

      function scrambleAndDecrypt() {
        if (isAnimating) return;
        isAnimating = true;

        const length = targetText.length;
        const totalFrames = length * 3 + 12;
        let frame = 0;

        function update() {
          frame++;
          let html = '';
          const resolvedCount = Math.floor((frame / totalFrames) * length);

          for (let i = 0; i < length; i++) {
            const char = targetText[i];
            if (char === ' ') {
              html += ' ';
              continue;
            }

            if (i < resolvedCount) {
              html += `<span class="resolved-char">${char}</span>`;
            } else {
              const randomChar = CHARS[Math.floor(Math.random() * CHARS.length)];
              html += `<span class="scrambled-char">${randomChar}</span>`;
            }
          }

          el.innerHTML = html;

          if (frame < totalFrames) {
            setTimeout(update, 28);
          } else {
            el.innerHTML = targetText;
            isAnimating = false;
          }
        }

        update();
      }

      setTimeout(scrambleAndDecrypt, 400);

      if (container) {
        container.addEventListener('mouseenter', scrambleAndDecrypt);
        container.addEventListener('click', scrambleAndDecrypt);
      }
    })();

        let lastPattern = null;
        try {

        } catch(e) {}

        let available = PATTERN_LIST.filter(p => p !== lastPattern);

        const randomIndex = Math.floor(Math.random() * available.length);
        const chosenPattern = available[randomIndex];

        try {
          sessionStorage.setItem('pixkit_last_wave', chosenPattern);
        } catch(e) {}

        if (patternSelect) {
          patternSelect.value = chosenPattern;
        }
        return chosenPattern;
      }

      // Automatically randomize on initial load

      if (patternSelect) {
        patternSelect.addEventListener('change', (e) => {
          activePattern = e.target.value;
        });
      }

      if (shuffleWaveBtn) {
        shuffleWaveBtn.addEventListener('click', () => {

      let width = 0;

      // Cube Configuration - ZERO GAP for seamless flat surface
      const CUBE_SIZE = 30;
      const GAP = 0;
      let cols = 0;
      let rows = 0;
      let grid = [];

      // Mouse & Ripple State
      const mouse = {
        x: -1000,
        y: -1000,
        targetX: -1000,
        targetY: -1000,
        radius: 200,
        strength: 36
      };

      const shockwaves = [];

      function getActiveThemeColors() {
        const isDark = TimeThemeManager.isDark();
        if (isDark) {
          return {
            bg: '#121310',
            paperRGB: { r: 18, g: 19, b: 16 },
            topActive: { r: 42, g: 46, b: 36 },
            sideActive: { r: 28, g: 31, b: 24 },
            activeLine: 'rgba(255, 255, 255, 0.22)',
            shadow: 'rgba(0, 0, 0, 0.45)'
          };
        } else {
          return {
            bg: '#FBFBF8',
            paperRGB: { r: 251, g: 251, b: 248 },
            topActive: { r: 255, g: 255, b: 255 },
            sideActive: { r: 218, g: 206, b: 182 },
            activeLine: 'rgba(34, 36, 31, 0.22)',
            shadow: 'rgba(34, 36, 31, 0.09)'
          };
        }
      }

      let time = 0;

      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);

        const step = CUBE_SIZE + GAP;
        cols = Math.ceil(width / step) + 4;
        rows = Math.ceil(height / step) + 4;

        grid = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = (c - 2) * step;
            const y = (r - 2) * step;
            grid.push({
              c,
              r,
              x,
              y,
              currentZ: 0,
              velocity: 0,
              intensity: 0
            });
          }
        }
      }

      window.addEventListener('resize', resize);
      resize();

      // Mouse events
      window.addEventListener('pointermove', (e) => {
        mouse.targetX = e.clientX;
        mouse.targetY = e.clientY;
      });

      window.addEventListener('pointerleave', () => {
        mouse.targetX = -1000;
        mouse.targetY = -1000;
      });

      window.addEventListener('pointerdown', (e) => {
        addShockwave(e.clientX, e.clientY, 42);
      });

      if (centerBrand) {
        centerBrand.addEventListener('pointerenter', () => {
          addShockwave(width / 2, height / 2, 48);
        });
      }

      function addShockwave(x, y, maxStrength = 40) {
        shockwaves.push({
          x,
          y,
          radius: 10,
          maxRadius: Math.max(width, height) * 0.75,
          speed: 16,
          strength: maxStrength,
          life: 1.0
        });
      }

      // 20 Distinct Mathematical & Generative Wave Algorithms
      function calculateElevation(cell, t, pattern, maxDepth) {
        const cx = width / 2;
        const cy = height / 2;
        const dx = cell.x - cx;
        const dy = cell.y - cy;
        const distFromCenter = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);

        let waveVal = 0;

        switch (pattern) {
          case 'harmonic':
            // 1. Oceanic Harmonic Tides: Multi-harmonic overlapping swells
            waveVal = Math.sin(cell.x * 0.007 + t * 1.5) * Math.cos(cell.y * 0.007 + t * 1.2) * 0.7
                    + Math.sin((cell.x + cell.y) * 0.005 - t * 1.8) * 0.5
                    + Math.cos(distFromCenter * 0.01 - t * 2.2) * 0.3;
            break;

          case 'vortex':
            // 2. Galactic Vortex Swirl: Twisting spiral arms rotating from center
            waveVal = Math.sin(angle * 4 + distFromCenter * 0.015 - t * 3.2) * 0.85
                    + Math.cos(angle * 2 - t * 1.5) * 0.25;
            break;

          case 'perlin':
            // 3. Quantum Perlin Noise: Simplex-like landscape turbulence
            waveVal = Math.sin(cell.x * 0.011 + t * 1.8) * Math.cos(cell.y * 0.011 - t * 1.4)
                    + Math.sin((cell.x * 0.018 - cell.y * 0.018) + t * 2.2) * 0.5
                    + Math.cos((cell.x + cell.y) * 0.02 - t * 1.6) * 0.3;
            break;

          case 'pulsar':
            // 4. Concentric Cyber Pulsar: Expanding radial shockwave rings
            waveVal = Math.sin(distFromCenter * 0.022 - t * 3.8) * Math.exp(-distFromCenter * 0.0008) * 1.1;
            break;

          case 'matrix':
            // 5. Cascading Matrix Rain: Digital rain data columns
            waveVal = Math.sin(cell.y * 0.022 - t * 4.2 + Math.sin(cell.x * 0.04) * 3.5) * 0.85;
            break;

          case 'doubleHelix':
            // 6. Double Helix Ribbon: Intersecting sinusoidal ribbons travelling diagonally
            const diag1 = (cell.x + cell.y) * 0.01;
            const diag2 = (cell.x - cell.y) * 0.01;
            waveVal = Math.sin(diag1 - t * 2.5) * Math.cos(diag2 + t * 2.0) * 0.9;
            break;

          case 'geodesic':
            // 7. Geodesic Dual Ripples: Interfering circular ripples from dual focal points
            const f1 = Math.sqrt(Math.pow(cell.x - width * 0.3, 2) + Math.pow(cell.y - height * 0.5, 2));
            const f2 = Math.sqrt(Math.pow(cell.x - width * 0.7, 2) + Math.pow(cell.y - height * 0.5, 2));
            waveVal = (Math.sin(f1 * 0.018 - t * 2.8) + Math.sin(f2 * 0.018 - t * 2.8)) * 0.5;
            break;

          case 'origami':
            // 8. Tessellated Standing Wave: Architectural checkerboard elevation
            waveVal = Math.sin(cell.x * 0.02) * Math.sin(cell.y * 0.02) * Math.sin(t * 3.0) * 0.9;
            break;

          case 'fibonacci':
            // 9. Fibonacci Spiral Galaxy: Golden ratio spiral sweep
            const spiral = Math.log(distFromCenter + 10) * 3 + angle * 3 - t * 3.0;
            waveVal = Math.sin(spiral) * Math.exp(-distFromCenter * 0.0005) * 0.9;
            break;

          case 'aurora':
            // 10. Aurora Borealis Undulation: Flowing atmospheric curtain waves
            const auroraCurtain = Math.sin(cell.x * 0.008 + Math.cos(cell.y * 0.012 + t * 1.6) * 2.5 + t * 2.0) * Math.sin(cell.y * 0.006 + t * 1.1);
            waveVal = auroraCurtain * 1.1 + Math.sin(cell.x * 0.02 - t * 3.0) * 0.25;
            break;

          case 'cymatics':
            // 11. Chladni Plate Cymatics: Harmonic acoustic plate nodal lines
            const nx = (cell.x / width) * Math.PI * 4;
            const ny = (cell.y / height) * Math.PI * 4;
            const chladni = Math.sin(3 * nx) * Math.sin(5 * ny) - Math.sin(5 * nx) * Math.sin(3 * ny);
            waveVal = Math.sin(chladni * 2.5 + t * 2.5) * 0.9;
            break;

          case 'moire':
            // 12. Hypnotic Moiré Lattice: Dual rotating frequency grids
            const rot1 = cell.x * Math.cos(t * 0.4) + cell.y * Math.sin(t * 0.4);
            const rot2 = cell.x * Math.cos(-t * 0.3) + cell.y * Math.sin(-t * 0.3);
            waveVal = (Math.sin(rot1 * 0.02) + Math.sin(rot2 * 0.02)) * 0.55 + Math.cos((rot1 + rot2) * 0.015) * 0.45;
            break;

          case 'equalizer':
            // 13. Metropolitan Skyline EQ: Rhythmic audio spectrum bars
            const colIndex = Math.floor(cell.x / 36);
            const barAmp = (Math.sin(colIndex * 1.2 + t * 3.5) * 0.5 + 0.5) * (Math.cos(colIndex * 0.7 - t * 2.2) * 0.5 + 0.5);
            const relY = 1 - (cell.y / height);
            waveVal = (relY < barAmp * 0.75) ? (1.0 - (barAmp * 0.75 - relY) * 1.5) : -0.6;
            break;

          case 'gravitational':
            // 14. Gravitational Lensing Well: Cosmic orbital gravity well warping surface
            const gx = width / 2 + Math.cos(t * 1.8) * (width * 0.28);
            const gy = height / 2 + Math.sin(t * 2.2) * (height * 0.22);
            const gDist = Math.sqrt(Math.pow(cell.x - gx, 2) + Math.pow(cell.y - gy, 2));
            waveVal = Math.sin(gDist * 0.035 - t * 4.0) * Math.exp(-gDist * 0.003) * 1.3;
            break;

          case 'lissajous':
            // 15. Lissajous Kinetic Orbit: Harmonic 3D resonance knots
            const lx = Math.sin(3 * t) * (width * 0.35) + width / 2;
            const ly = Math.sin(2 * t + Math.PI / 4) * (height * 0.35) + height / 2;
            const lDist = Math.sqrt(Math.pow(cell.x - lx, 2) + Math.pow(cell.y - ly, 2));
            waveVal = Math.sin(lDist * 0.03 - t * 3.5) * Math.max(0, 1 - lDist / 380) * 1.25;
            break;

          case 'topography':
            // 16. Terraced Strata Topography: Stepped architectural contour elevation
            const rawTopo = (Math.sin(cell.x * 0.008 + t * 0.8) + Math.cos(cell.y * 0.008 - t * 0.6) + Math.sin((cell.x + cell.y) * 0.006 + t * 1.2) + 3) / 6;
            const steps = 6;
            const terraced = Math.floor(rawTopo * steps) / steps;
            waveVal = (terraced - 0.5) * 2.2;
            break;

          case 'crystal':
            // 17. Diamond Crystal Lattice: Manhattan distance diamond refraction waves
            const manhattan = Math.abs(dx) + Math.abs(dy);
            waveVal = Math.sin(manhattan * 0.02 - t * 3.5) * Math.cos((cell.x - cell.y) * 0.015 + t * 2.0) * 0.9;
            break;

          case 'scanline':
            // 18. Cyberpunk Glitch Scanline: High-speed radar beam sweep with micro-jitter
            const scanPos = ((t * 240) % (height + 300)) - 150;
            const scanDist = Math.abs(cell.y - scanPos);
            const pulse = Math.sin(cell.x * 0.05 + t * 6.0) * 0.2;
            waveVal = (scanDist < 120 ? Math.cos((scanDist / 120) * (Math.PI / 2)) * 1.2 : 0) + pulse;
            break;

          case 'synapse':
            // 19. Bioluminescent Neural Synapse: Branching electrical dendritic pulses
            const radial = Math.sin(distFromCenter * 0.015 - t * 3.0);
            const spokes = Math.sin(angle * 8 + Math.sin(distFromCenter * 0.02 - t * 2.0) * 4);
            waveVal = (radial * 0.6 + spokes * 0.6) * Math.exp(-distFromCenter * 0.001);
            break;

          case 'cursorOnly':
            // 20. Pure Flat Calm: Resting plane, elevates exclusively on cursor interaction
            waveVal = 0;
            break;

          default:
            waveVal = Math.sin(cell.x * 0.01 + t * 2) * Math.cos(cell.y * 0.01 + t * 2);
        }

        let elevation = 0;
        if (pattern !== 'cursorOnly') {
          const normalized = Math.max(0, (waveVal + 0.35) / 1.55);
          elevation = normalized * (maxDepth * 0.5);
        }

        // Mouse Hover Lift
        const mouseDx = cell.x - mouse.x;
        const mouseDy = cell.y - mouse.y;
        const mouseDist = Math.sqrt(mouseDx * mouseDx + mouseDy * mouseDy);

        if (mouseDist < mouse.radius) {
          const factor = (1 - mouseDist / mouse.radius);
          const smoothFactor = factor * factor * (3 - 2 * factor);
          elevation += smoothFactor * maxDepth;
        }

        // Shockwaves Ripple Lift
        for (let i = 0; i < shockwaves.length; i++) {
          const sw = shockwaves[i];
          const sDx = cell.x - sw.x;
          const sDy = cell.y - sw.y;
          const sDist = Math.sqrt(sDx * sDx + sDy * sDy);
          const ringDist = Math.abs(sDist - sw.radius);
          const ringWidth = 70;

          if (ringDist < ringWidth) {
            const shockFactor = (1 - ringDist / ringWidth) * sw.life;
            elevation += Math.sin(shockFactor * Math.PI) * sw.strength;
          }
        }

        return Math.max(0, elevation);
      }

      // Draw Cube ONLY when elevated above flat surface
      function drawSeamlessVoxelCube(x, y, size, heightZ, intensity, colors) {
        if (heightZ < 0.8) return;

        const topY = y - heightZ;
        const half = size / 2;

        // Soft ambient drop shadow under rising cube
        if (heightZ > 3) {
          ctx.fillStyle = colors.shadow;
          ctx.beginPath();
          ctx.roundRect(x - half + 1, y - half + 2, size - 2, size - 2, 4);
          ctx.fill();
        }

        // 1. FRONT 3D EXTRUSION FACE (Rich Cream White Tone / Deep Obsidian Tone)
        if (heightZ > 2.0) {
          const sideR = Math.round(colors.paperRGB.r + (colors.sideActive.r - colors.paperRGB.r) * intensity);
          const sideG = Math.round(colors.paperRGB.g + (colors.sideActive.g - colors.paperRGB.g) * intensity);
          const sideB = Math.round(colors.paperRGB.b + (colors.sideActive.b - colors.paperRGB.b) * intensity);

          ctx.fillStyle = `rgb(${sideR}, ${sideG}, ${sideB})`;
          ctx.beginPath();
          ctx.moveTo(x - half, topY + half);
          ctx.lineTo(x + half, topY + half);
          ctx.lineTo(x + half, y + half);
          ctx.lineTo(x - half, y + half);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = colors.activeLine;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        // 2. TOP FACE (Pure Crisp White / Dark Stone)
        const topR = Math.round(colors.paperRGB.r + (colors.topActive.r - colors.paperRGB.r) * intensity);
        const topG = Math.round(colors.paperRGB.g + (colors.topActive.g - colors.paperRGB.g) * intensity);
        const topB = Math.round(colors.paperRGB.b + (colors.topActive.b - colors.paperRGB.b) * intensity);

        ctx.fillStyle = `rgb(${topR}, ${topG}, ${topB})`;
        ctx.beginPath();
        const cornerR = Math.min(4, Math.max(1, heightZ * 0.4));
        ctx.roundRect(x - half, topY - half, size, size, cornerR);
        ctx.fill();

        ctx.strokeStyle = colors.activeLine;
        ctx.lineWidth = 0.9;
        ctx.stroke();
      }

      // Animation Loop
      function render() {
        const speed = speedSlider ? (parseFloat(speedSlider.value) || 1.0) : 1.0;
        const maxDepth = depthSlider ? (parseFloat(depthSlider.value) || 32) : 32;
        const colors = getActiveThemeColors();

        time += 0.014 * speed;

        // Smooth mouse lerping
        mouse.x += (mouse.targetX - mouse.x) * 0.16;
        mouse.y += (mouse.targetY - mouse.y) * 0.16;

        // Shockwaves update
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.radius += sw.speed;
          sw.life = 1 - (sw.radius / sw.maxRadius);
          if (sw.life <= 0 || sw.radius >= sw.maxRadius) {
            shockwaves.splice(i, 1);
          }
        }

        // Clear canvas with active theme background color
        ctx.fillStyle = colors.bg;
        ctx.fillRect(0, 0, width, height);

        // Update physics
        for (let i = 0; i < grid.length; i++) {
          const cell = grid[i];
          const targetZ = calculateElevation(cell, time, activePattern, maxDepth);

          const force = (targetZ - cell.currentZ) * 0.20;
          cell.velocity = (cell.velocity + force) * 0.72;
          cell.currentZ += cell.velocity;

          cell.intensity = Math.max(0, Math.min(1, cell.currentZ / maxDepth));
        }

        // Render elevated cubes only
        for (let i = 0; i < grid.length; i++) {
          const cell = grid[i];
          drawSeamlessVoxelCube(cell.x, cell.y, CUBE_SIZE, cell.currentZ, cell.intensity, colors);
        }

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
