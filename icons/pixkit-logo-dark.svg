<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0a0a0c" rx="16"/>
  <!-- Glowing Ambient Halo -->
  <circle cx="80" cy="60" r="36" fill="#10b981" opacity="0.12" filter="blur(16px)"/>
  
  <!-- Eight-Pointed Starburst Mark -->
  <g transform="translate(80, 60)" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#34d399" stroke-width="7"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#34d399" stroke-width="7"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#a7f3d0" stroke-width="6"/>
    <line x1="-20" y1="20" x2="20" y2="-20" stroke="#a7f3d0" stroke-width="6"/>
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="none"/>
  </g>

  <!-- Typography -->
  <text x="140" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#ffffff">
    pix<tspan fill="#34d399">kit</tspan>
  </text>
</svg>
